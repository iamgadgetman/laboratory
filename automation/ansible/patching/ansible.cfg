[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
# The standalone "yaml" callback lives in community.general and is absent from
# a plain ansible-core install. result_format=yaml on the default callback is
# the built-in equivalent, so this stays collection-free.
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
forks                = 10
timeout              = 30
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout  = 7200

[ssh_connection]
pipelining   = True
# IdentitiesOnly=yes is load-bearing, not tidiness. Without it ssh also offers
# every default key (~/.ssh/id_*) and any agent identity, so a host where the
# patchbot key was never deployed still connects using your personal key. That
# makes ansible_ssh_private_key_file advisory, silently defeats the from=
# restriction, and lets bootstrap verification report success for a host that
# was never actually set up.
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey -o IdentitiesOnly=yes
control_path = /tmp/ansible-%%h-%%p-%%r

[privilege_escalation]
become        = False
become_method = sudo
