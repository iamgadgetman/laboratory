---
# Homelab patch inventory (sanitized — addresses follow docs/SANITIZATION.md).
#
# CONTROL HOST: union (Fort). It already runs Prometheus, Grafana, n8n and the
# lab dashboard, so reports land where they are consumed. union therefore
# appears twice on purpose: as `localhost` in the `control` group (reporting,
# local connection) and as `union` in ubuntu_servers, patched over SSH like
# anything else. It is in no_auto_reboot, so it never restarts itself unattended.
#
# Every address was verified by probing :22 from the control host and
# cross-checking the Prometheus scrape config before it went in here.
#
# Deliberately unmanaged: unRAID (not apt), the two OPNsense firewalls (not
# apt), and both OpenMediaVault NAS boxes — OMV pins its own Debian package
# set and its web UI owns updates, so unattended dist-upgrade is the wrong tool.

all:
  vars:
    ansible_user: gadget
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_patchbot

  children:

    # ── The box running Ansible. Kept in inventory so group_vars/all.yml
    #    (report_dir, webhook settings) applies to the reporting play.
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # ── Ordinary Ubuntu servers: patch + auto-reboot in window ────────────
    ubuntu_servers:
      hosts:
        voyager:                    # Hawk
          ansible_host: 10.20.0.8
        eagle:                      # Hawk Swarm manager (orchestrator)
          ansible_host: 10.20.1.8
        falcon:                     # Hawk Swarm manager
          ansible_host: 10.20.1.9
        talon:                      # Hawk Swarm manager (ingress)
          ansible_host: 10.20.1.10
        knox:                       # Fort reverse proxy
          ansible_host: 10.40.2.18
        dilithium:                  # Fort workstation
          ansible_host: 10.40.0.16
        union:                      # Fort Docker host / control host
          ansible_host: 10.40.2.20
          # Semaphore runs as a macvlan container on union and so cannot reach
          # its own host. PATCH_SSH_JUMP is set only inside that container,
          # which jumps via knox; timer runs leave it empty and go direct.
          ansible_ssh_common_args: "{{ lookup('env', 'PATCH_SSH_JUMP') | default('', true) }}"

    # ── Hosts running CubeCoders AMP ──────────────────────────────────────
    # These get the AMP update flow and are never rebooted without approval.
    amp_hosts:
      hosts:
        holodeck:
          ansible_host: 10.40.3.21

    # ── Hosts running Docker workloads: verify containers after reboot ────
    docker_hosts:
      hosts:
        knox:
        union:
        holodeck:
        eagle:
        falcon:
        talon:
        voyager:

    # ── Anything that must never reboot unattended ────────────────────────
    no_auto_reboot:
      hosts:
        union:        # control host — reboot by hand
        holodeck:     # game servers — players get dropped
        pve:          # hypervisor

    # ── Proxmox hypervisors (Debian-based; apt works, kernel = extra care) ─
    proxmox:
      hosts:
        pve:
          ansible_host: 10.40.0.32
          # Proxmox has no unprivileged patch account, so the patchbot key goes
          # to root's authorized_keys. Ansible skips become when become_user
          # matches the remote user, so `become: true` tasks run unchanged.
          ansible_user: root
