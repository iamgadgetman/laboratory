! FRR running-config — Hawk site edge (OPNsense + os-frr, FRR 10.7.1)
! Captured live 2026-10-04 after the BGP policy fix, then sanitized
! per docs/SANITIZATION.md. See networking/bgp-fix-2026-10.md.

!
frr version 10.7.1
frr defaults traditional
hostname stop.hawk.example.net
log syslog
!
ip prefix-list 10.20.2.0 seq 30 permit 10.20.2.0/24
ip prefix-list 10.20.3.0 seq 40 permit 10.20.3.0/24
ip prefix-list 10.40.0.0 seq 15 permit 10.40.0.0/24
ip prefix-list 10.40.0.0 seq 20 permit 10.40.0.0/22 ge 24
ip prefix-list 10.40.1.0 seq 25 permit 10.40.1.0/24
ip prefix-list 10.40.2.0 seq 35 permit 10.40.2.0/24
ip prefix-list 10.40.3.0 seq 45 permit 10.40.3.0/24
ip prefix-list 10.20.0.0 seq 10 permit 10.20.0.0/24
ip prefix-list 10.20.0.0 seq 11 permit 10.20.0.0/22 ge 24
ip prefix-list 10.20.1.0 seq 20 permit 10.20.1.0/24
ip prefix-list 10.99.0.0 seq 40 permit 10.99.0.0/29 le 32
ip prefix-list 10.99.0.0 seq 60 permit 10.99.0.0/29
ip prefix-list 10.99.1.0 seq 30 permit 10.99.1.0/24 le 32
ip prefix-list 10.99.1.1 seq 50 permit 10.99.1.1/32
ip prefix-list 10.99.1.2 seq 55 permit 10.99.1.2/32
ip prefix-list 10.255.0.0 seq 50 permit 10.255.0.0/24 le 32
ip prefix-list 10.255.0.0 seq 70 permit 10.255.0.0/24
!
route-map Fort permit 10
 match ip address prefix-list 10.40.0.0
exit
!
route-map Fort permit 11
 match ip address prefix-list 10.99.1.0
exit
!
route-map Fort permit 12
 match ip address prefix-list 10.99.0.0
exit
!
route-map Fort permit 13
 match ip address prefix-list 10.255.0.0
exit
!
route-map Hawk permit 20
 match ip address prefix-list 10.20.0.0
exit
!
route-map Hawk permit 21
 match ip address prefix-list 10.99.1.0
exit
!
route-map Hawk permit 22
 match ip address prefix-list 10.99.0.0
exit
!
route-map Hawk permit 23
 match ip address prefix-list 10.255.0.0
exit
!
interface bridge0
 ip ospf passive
exit
!
interface bridge1
 ip ospf passive
exit
!
interface bridge2
 ip ospf passive
exit
!
interface bridge3
 ip ospf passive
exit
!
interface em0
 ip ospf passive
exit
!
interface igb0
 ip ospf passive
exit
!
interface wg0
 ip ospf network non-broadcast
exit
!
router bgp 65551
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor Fort peer-group
 neighbor Fort remote-as 65552
 neighbor Fort update-source wg0
 neighbor 10.255.0.2 peer-group Fort
 neighbor 10.255.0.2 description fort
 neighbor 10.255.0.2 ebgp-multihop
 neighbor 10.255.0.2 update-source lo1
 bgp listen range 10.99.0.0/24 peer-group Fort
 !
 address-family ipv4 unicast
  distance bgp 200 200 200
  network 10.20.0.0/24
  network 10.20.1.0/24
  network 10.20.2.0/24
  network 10.20.3.0/24
  network 10.99.1.1/32
  network 10.99.0.0/29
  network 10.255.0.1/32
  redistribute connected route-map Hawk
  neighbor Fort activate
  neighbor Fort prefix-list 10.20.0.0 out
  neighbor Fort route-map Fort in
  neighbor Fort route-map Hawk out
  neighbor 10.255.0.2 prefix-list 10.40.0.0 in
  neighbor 10.255.0.2 prefix-list 10.20.0.0 out
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map Hawk
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.1
 log-adjacency-changes
 network 10.20.0.0/24 area 0.0.0.0
 network 10.20.1.0/24 area 0.0.0.0
 network 10.20.2.0/24 area 0.0.0.0
 network 10.20.3.0/24 area 0.0.0.0
 network 10.99.1.1/32 area 0.0.0.0
 network 10.99.0.0/29 area 0.0.0.0
 network 10.255.0.1/32 area 0.0.0.0
 area 0.0.0.0 range 10.20.0.0/22
 area 0.0.0.0 filter-list prefix 10.20.3.0 in
 area 0.0.0.0 filter-list prefix 10.255.0.0 out
 neighbor 10.99.0.2 poll-interval 5
exit
!
bfd
exit
!
end
